<html data-namespace-typo3-fluid="true" xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" xmlns:vdcp="http://typo3.org/ns/Vd/VdClimatePolicy/ViewHelpers">
    <f:section name="Default">
        <div class="vd-climate-policy">
            <f:for as="record" each="{records}">
                <div class="climate-policy mb-3">
                    <div class="card-body pb-1">
                        <h3 class="card-title mt-0 mb-2">{record.name}</h3>
                        <div class="row mb-1">
                            <div class="col-md-3"><strong><vdcp:translate id="cities"/></strong></div>
                            <div class="col-md-9">{record.cities}</div>
                        </div>
                        <div class="row mb-1">
                            <div class="col-md-3"><strong><vdcp:translate id="links"/></strong></div>
                            <div class="col-md-9">
                                <ul class="list-unstyled mb-0">
                                    <f:for as="link" each="{record.links}">
                                        <li><f:link.typolink parameter="{link.link}">{link.text}</f:link.typolink></li>
                                    </f:for>
                                </ul>
                            </div>
                        </div>
                        <div class="row mb-1">
                            <div class="col-md-3"><strong><vdcp:translate id="peccFile"/></strong></div>
                            <div class="col-md-9">
                                <span class="square-pecc" style="background-color: {record.pecc.0.color}">{record.pecc.0.number}</span>&nbsp;{record.pecc.0.name}
                            </div>
                        </div>
                    </div>
                </div>
            </f:for>
        </div>
    </f:section>
</html>
