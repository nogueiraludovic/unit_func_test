<html data-namespace-typo3-fluid="true" xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers">
    <f:if condition="{item.price}">
        <dl class="row">
            <dt class="col-md-4"><f:translate id="{label}"/></dt>
            <dd class="col-md-8">
                CHF
                <f:format.number decimals="2" decimalSeparator="." thousandsSeparator="'">{item.price}</f:format.number>
            </dd>
        </dl>
    </f:if>
</html>
