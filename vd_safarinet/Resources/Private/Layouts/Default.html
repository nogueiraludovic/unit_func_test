<html data-namespace-typo3-fluid="true" xmlns:f="http://typo3.org/ns/fluid/ViewHelpers">
    <f:if condition="{error}">
        <f:then>
            <div class="highlight-dark vd-content-column vd-highlight">
                <div class="mb-0">
                    <h2 id="warning-title">Attention</h2>
                    <p><f:translate id="siel_maintenance_message"/></p>
                </div>
            </div>
        </f:then>
        <f:else>
            <f:render section="Main"/>
        </f:else>
    </f:if>
</html>
