<html data-namespace-typo3-fluid="true" xmlns:f="http://typo3.org/ns/TYPO3/Fluid/ViewHelpers" xmlns:s="http://typo3.org/ns/ApacheSolrForTypo3/Solr/ViewHelpers/">
    <f:renderChildren arguments="{contentArguments}"/>
    <f:if condition="{configuration.insertBelow}">
        <f:render arguments="{configuration:configuration, pagination: contentArguments.pagination, resultSet: resultSet}"section="paginator"/>
    </f:if>
    <f:section name="paginator">
        <f:if condition="{pagination.numberOfPages} > 1">
            <nav aria-label="Pagination" class="vd-pagination">
                <ul class="vd-pagination__list">
                    <f:if condition="{pagination.previousPage}">
                        <li class="vd-pagination__item vd-pagination__item--previous">
                            <a class="vd-pagination__link" href="{s:uri.paginate.resultPage(page: pagination.previousPage)}" id="previous-page-link">
                                <span class="vd-pagination__title">
                                    <span class="fa-chevron-left fa-solid" aria-hidden="true"></span>
                                    <f:translate extensionName="VdSolr" id="previous_page"/>
                                </span>
                                <span class="visually-hidden">:</span>
                                <span class="vd-pagination__label"><f:translate extensionName="VdSolr" id="page_of_total" arguments="{0: pagination.previousPage, 1: pagination.numberOfPages}"/></span>
                            </a>
                        </li>
                    </f:if>
                    <f:if condition="{pagination.nextPage}">
                        <li class="vd-pagination__item vd-pagination__item--next">
                            <a class="vd-pagination__link" href="{s:uri.paginate.resultPage(page: pagination.nextPage)}" id="next-page-link">
                                <span class="vd-pagination__title">
                                    <f:translate extensionName="VdSolr" id="next_page"/>
                                    <span class="fa-chevron-right fa-solid" aria-hidden="true"></span>
                                </span>
                                <span class="visually-hidden">:</span>
                                <span class="vd-pagination__label"><f:translate extensionName="VdSolr" id="page_of_total" arguments="{0: pagination.nextPage, 1: pagination.numberOfPages}"/></span>
                            </a>
                        </li>
                    </f:if>
                </ul>
            </nav>
        </f:if>
    </f:section>
</html>
