<html data-namespace-typo3-fluid="true" xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers">
    <f:if condition="{header}">
        <f:switch expression="{layout}">
            <f:case value="1">
                <h1{f:if(condition: additionalClass, then: ' class="{additionalClass}"')}>
                    <f:link.typolink parameter="{link}">{header}</f:link.typolink>
                </h1>
            </f:case>
            <f:case value="2">
                <h2{f:if(condition: additionalClass, then: ' class="{additionalClass}"')}>
                    <f:link.typolink parameter="{link}">{header}</f:link.typolink>
                </h2>
            </f:case>
            <f:case value="3">
                <h3{f:if(condition: additionalClass, then: ' class="{additionalClass}"')}>
                    <f:link.typolink parameter="{link}">{header}</f:link.typolink>
                </h3>
            </f:case>
            <f:case value="4">
                <h4{f:if(condition: additionalClass, then: ' class="{additionalClass}"')}>
                    <f:link.typolink parameter="{link}">{header}</f:link.typolink>
                </h4>
            </f:case>
            <f:case value="5">
                <h5{f:if(condition: additionalClass, then: ' class="{additionalClass}"')}>
                    <f:link.typolink parameter="{link}">{header}</f:link.typolink>
                </h5>
            </f:case>
            <f:case value="6">
                <h2 class="h4 mt-md-0 vd-heading-light-alt{f:if(condition: additionalClass, then: ' {additionalClass}')}">
                    <f:link.typolink parameter="{link}">{header}</f:link.typolink>
                </h2>
            </f:case>
            <f:case value="7">
                <h3 class="h4 vd-heading-light-alt{f:if(condition: additionalClass, then: ' {additionalClass}')}">
                    <f:link.typolink parameter="{link}">{header}</f:link.typolink>
                </h3>
            </f:case>
            <f:case value="8">
                <f:link.typolink parameter="{link}" class="d-inline-block vd-link-invisible">
                    <span class="h3">{header}</span>
                </f:link.typolink>
            </f:case>
            <f:defaultCase>
                <f:if condition="{default}">
                    <f:render arguments="{additionalClass: additionalClass, header: header, layout: default, link: link}" partial="Header/Header"/>
                </f:if>
            </f:defaultCase>
        </f:switch>
    </f:if>
</html>
