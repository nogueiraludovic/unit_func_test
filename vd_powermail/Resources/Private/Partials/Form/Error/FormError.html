<html data-namespace-typo3-fluid="true" xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" xmlns:p="http://typo3.org/ns/In2code/Powermail/ViewHelpers">
    <f:form.validationResults>
        <f:if condition="{validationResults.flattenedErrors}">
            <div aria-labelledby="error-summary-title" class="mb-3 vd-error-summary" role="alert" tabindex="-1">
                <h2 id="error-summary-title"><f:translate extensionName="VdPowermail" id="there_is_a_problem"/></h2>
                <ul>
                    <f:for as="errors" each="{validationResults.flattenedErrors}">
                        <f:for as="error" each="{errors}">
                            <li>
                                <f:if condition="{error.message} == 'spam_details'">
                                    <f:then>
                                        <f:translate id="validationerror_spam"/> {error.arguments.spamfactor}
                                    </f:then>
                                    <f:else>
                                        <f:if condition="{error.arguments.marker}">
                                            <strong><p:getter.getFieldPropertyFromMarkerAndForm form="{form}" marker="{error.arguments.marker}" property="title"/> : </strong>
                                        </f:if>
                                    </f:else>
                                </f:if>
                                <f:translate id="validationerror_{error.message}">{error.message}</f:translate>
                            </li>
                        </f:for>
                    </f:for>
                </ul>
            </div>
        </f:if>
    </f:form.validationResults>
</html>
